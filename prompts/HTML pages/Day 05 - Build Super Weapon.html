<!DOCTYPE html>
<html>
<head>
    <title>Space Rocket Shooter</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000 url('https://cdn.stocksnap.io/img-thumbs/960w/moon-craters_OHYSVCPGJK.jpg') center/cover no-repeat fixed; 
            overflow: hidden; 
            font-family: Arial; 
        }
        canvas { 
            display: block; 
            background: transparent; 
        }
        #info { position: absolute; top: 10px; left: 10px; color: white; z-index: 10; }
    </style>
</head>
<body>
    <div id="info">
        Click to shoot! Hit rockets for fireworks! Hit lunchbox for missiles! Press P to pause<br>
        Press B to activate Super Weapon! (2 uses remaining) 
    </div>
    <button id="pauseBtn" style="position: absolute; top: 10px; right: 10px; padding: 10px 20px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">PAUSE</button>
    <canvas id="game"></canvas>
    
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Preload background image
        const bgImg = new Image();
        bgImg.src = 'https://cdn.stocksnap.io/img-thumbs/960w/moon-craters_OHYSVCPGJK.jpg';

        let rockets = [];
        let bullets = [];
        let lasers = [];
        let fireworks = [];
        let lunchboxes = [];
        let missiles = [];
        let powerUps = [];
        let score = 0;
        let missedRockets = 0;
        let gameState = 'playing';
        let gameOverTime = 0;
        let gameTimer = 60;
        let gameStartTime = Date.now();
        let pausedTime = 0;
        let missileMode = false;
        let missileModeTimer = 0;
        let laserMode = false;
        let laserModeTimer = 0;
        let lunchboxHits = [];
        let lunchboxHitWindow = 180; // 3 seconds at 60fps
        let superWeaponUses = 2;
        let superWeaponActive = false;
        let superWeaponTimer = 0;
        
        // Power-up system
        let weaponLevel = 1; // 1 = single, 2 = dual, 3 = machine gun
        let machineGunTimer = 0;
        let isMouseDown = false;
        let lastShotTime = 0;
        const machineGunRate = 100; // milliseconds between shots
        
        // Spaceship variables
        let spaceship = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            targetX: canvas.width / 2,
            targetY: canvas.height - 100,
            size: 30,
            thrustParticles: []
        };
        
        // Mouse tracking and controls
        canvas.addEventListener('mousemove', (e) => {
            spaceship.targetX = e.clientX;
            spaceship.targetY = e.clientY;
        });
        
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            if (gameState === 'playing') {
                initAudio();
                shootWeapon(e.clientX, e.clientY);
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isMouseDown = false;
        });
        
        // Prevent context menu on right click
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        let audioContext;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playShootSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }
        
        function playExplosionSound() {
            if (!audioContext) return;
            const oscillator1 = audioContext.createOscillator();
            const gainNode1 = audioContext.createGain();
            oscillator1.connect(gainNode1);
            gainNode1.connect(audioContext.destination);
            oscillator1.type = 'sawtooth';
            oscillator1.frequency.setValueAtTime(150, audioContext.currentTime);
            oscillator1.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.3);
            gainNode1.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            oscillator1.start(audioContext.currentTime);
            oscillator1.stop(audioContext.currentTime + 0.3);
        }
        
        function playMissileSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }
        
        function playLunchboxSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1500, audioContext.currentTime + 0.15);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }
        
        function playPowerUpSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.1);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }
        
       function playSuperWeaponSound() {
            if (!audioContext) return;
            
            // Phase 1: Deep charging rumble (0-300ms)
            const lowRumble = audioContext.createOscillator();
            const lowGain = audioContext.createGain();
            lowRumble.connect(lowGain);
            lowGain.connect(audioContext.destination);
            
            lowRumble.type = 'sawtooth';
            lowRumble.frequency.setValueAtTime(60, audioContext.currentTime);
            lowRumble.frequency.exponentialRampToValueAtTime(120, audioContext.currentTime + 0.3);
            lowGain.gain.setValueAtTime(0.2, audioContext.currentTime);
            lowGain.gain.exponentialRampToValueAtTime(0.4, audioContext.currentTime + 0.3);
            
            lowRumble.start(audioContext.currentTime);
            lowRumble.stop(audioContext.currentTime + 0.3);
            
            // Phase 2: High energy buildup (150-450ms)
            setTimeout(() => {
                const highCharge = audioContext.createOscillator();
                const highGain = audioContext.createGain();
                highCharge.connect(highGain);
                highGain.connect(audioContext.destination);
                
                highCharge.type = 'square';
                highCharge.frequency.setValueAtTime(400, audioContext.currentTime);
                highCharge.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.3);
                highGain.gain.setValueAtTime(0.1, audioContext.currentTime);
                highGain.gain.exponentialRampToValueAtTime(0.3, audioContext.currentTime + 0.2);
                highGain.gain.exponentialRampToValueAtTime(0.05, audioContext.currentTime + 0.3);
                
                highCharge.start(audioContext.currentTime);
                highCharge.stop(audioContext.currentTime + 0.3);
            }, 150);
            
            // Phase 3: Massive explosion (500ms)
            setTimeout(() => {
                // Low frequency boom
                const boom = audioContext.createOscillator();
                const boomGain = audioContext.createGain();
                boom.connect(boomGain);
                boomGain.connect(audioContext.destination);
                
                boom.type = 'sawtooth';
                boom.frequency.setValueAtTime(80, audioContext.currentTime);
                boom.frequency.exponentialRampToValueAtTime(30, audioContext.currentTime + 0.5);
                boomGain.gain.setValueAtTime(0.5, audioContext.currentTime);
                boomGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                boom.start(audioContext.currentTime);
                boom.stop(audioContext.currentTime + 0.5);
                
                // High frequency crackle
                const crackle = audioContext.createOscillator();
                const crackleGain = audioContext.createGain();
                crackle.connect(crackleGain);
                crackleGain.connect(audioContext.destination);
                
                crackle.type = 'square';
                crackle.frequency.setValueAtTime(2000, audioContext.currentTime);
                crackle.frequency.exponentialRampToValueAtTime(500, audioContext.currentTime + 0.3);
                crackleGain.gain.setValueAtTime(0.2, audioContext.currentTime);
                crackleGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                crackle.start(audioContext.currentTime);
                crackle.stop(audioContext.currentTime + 0.3);
            }, 500);
        }

        function activateSuperWeapon() {
            if (superWeaponUses <= 0 || superWeaponActive) return;
            
            initAudio();
            playSuperWeaponSound();
            
            superWeaponUses--;
            superWeaponActive = true;
            superWeaponTimer = 45; // 0.75 seconds at 60fps
            
            // Award points and clear rockets during flash
            setTimeout(() => {
                score += rockets.length * 3;
                rockets = [];
            }, 500); // Clear during flash
        }

        function shootWeapon(x, y) {
            const currentTime = Date.now();
            
            if (weaponLevel === 3) { // Machine gun mode
                if (currentTime - lastShotTime < machineGunRate) return;
                lastShotTime = currentTime;
            }
            
            if (laserMode) {
                if (weaponLevel === 1) {
                    lasers.push(new Laser(x, y));
                } else if (weaponLevel === 2) {
                    lasers.push(new Laser(spaceship.x - 15, spaceship.y));
                    lasers.push(new Laser(spaceship.x + 15, spaceship.y));
                } else if (weaponLevel === 3) {
                    lasers.push(new Laser(spaceship.x - 20, spaceship.y));
                    lasers.push(new Laser(spaceship.x, spaceship.y));
                    lasers.push(new Laser(spaceship.x + 20, spaceship.y));
                }
            } else {
                if (weaponLevel === 1) {
                    bullets.push(new Bullet(x, y));
                } else if (weaponLevel === 2) {
                    bullets.push(new Bullet(spaceship.x - 15, spaceship.y));
                    bullets.push(new Bullet(spaceship.x + 15, spaceship.y));
                } else if (weaponLevel === 3) {
                    bullets.push(new Bullet(spaceship.x - 20, spaceship.y));
                    bullets.push(new Bullet(spaceship.x, spaceship.y));
                    bullets.push(new Bullet(spaceship.x + 20, spaceship.y));
                }
            }
            
            playShootSound();
        }
        
        const rocketImage = new Image();
        rocketImage.src = "data:image/svg+xml;base64," + btoa(`<svg width="32" height="80" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff6b6b"/>
                    <stop offset="50%" style="stop-color:#4ecdc4"/>
                    <stop offset="100%" style="stop-color:#45b7d1"/>
                </linearGradient>
                <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff9500"/>
                    <stop offset="50%" style="stop-color:#ff6b00"/>
                    <stop offset="100%" style="stop-color:#ff0000"/>
                </linearGradient>
            </defs>
            <rect x="8" y="16" width="16" height="40" fill="url(#rocketGrad)" rx="4"/>
            <polygon points="16,0 8,16 24,16" fill="#ffd93d"/>
            <polygon points="4,44 8,36 8,56" fill="#666"/>
            <polygon points="28,44 24,36 24,56" fill="#666"/>
            <polygon points="12,56 16,80 20,56" fill="url(#flameGrad)"/>
            <circle cx="16" cy="30" r="4" fill="#87ceeb"/>
            <rect x="10" y="20" width="12" height="2" fill="#fff" opacity="0.7"/>
            <rect x="10" y="40" width="12" height="2" fill="#fff" opacity="0.7"/>
        </svg>`);
        
        class PowerUp {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -30;
                this.vy = 2 + Math.random() * 2;
                this.size = 25;
                this.rotation = 0;
                this.rotationSpeed = 0.05;
                this.pulse = 0;
                this.type = Math.random() < 0.5 ? 'dual' : 'machine'; // 50/50 chance
            }
            
            update() {
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.pulse += 0.1;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Glowing effect
                const glowIntensity = Math.sin(this.pulse) * 0.3 + 0.7;
                ctx.shadowColor = this.type === 'dual' ? '#00ffff' : '#ff00ff';
                ctx.shadowBlur = 25 * glowIntensity;
                
                // Main power-up body
                ctx.fillStyle = this.type === 'dual' ? '#00aaff' : '#ff0099';
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Border
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Icon
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                if (this.type === 'dual') {
                    ctx.fillText('2X', 0, 5);
                } else {
                    ctx.fillText('MG', 0, 5);
                }
                
                ctx.restore();
                ctx.shadowBlur = 0;
            }
        }
        
        class Rocket {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.vy = -2 - Math.random() * 3;
                this.size = 16;
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
            }
            
            update() {
                this.y += this.vy;
            }
            
            draw() {
                if (rocketImage.complete) {
                    ctx.drawImage(rocketImage, this.x - 16, this.y - 40, 32, 80);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x - this.size/2, this.y - this.size, this.size, this.size * 2);
                    ctx.fillStyle = 'orange';
                    ctx.fillRect(this.x - 6, this.y + this.size, 12, 20);
                }
            }
        }
        
        class Lunchbox {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -30;
                this.vy = 1.5 + Math.random() * 2;
                this.size = 30;
                this.rotation = 0;
                this.rotationSpeed = 0.02 + Math.random() * 0.04;
                this.pulse = 0;
            }
            
            update() {
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.pulse += 0.1;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Glowing effect
                const glowIntensity = Math.sin(this.pulse) * 0.3 + 0.7;
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 20 * glowIntensity;
                
                // Main lunchbox body
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Handle
                ctx.fillStyle = '#333';
                ctx.fillRect(-this.size/6, -this.size/2 - 5, this.size/3, 8);
                
                // Logo/symbol
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🍱', 0, 5);
                
                ctx.restore();
                ctx.shadowBlur = 0;
            }
        }
        
        class Laser {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = -15; // Faster than normal bullet
                this.size = 8;  // Longer than normal bullet
                this.width = 4;
                this.height = 20;
            }
            
            update() {
                this.y += this.vy;
            }
            
            draw() {
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height);
                // Glow effect
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }
        
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = -8;
                this.size = 3;
            }
            
            update() {
                this.y += this.vy;
            }
            
            draw() {
                ctx.fillStyle = 'yellow';
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
            }
        }
           
        
        class Missile {
            constructor(targetX, targetY) {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 4;
                this.angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.trail = [];
                this.life = 300;
            }
            
            update() {
                // Add current position to trail
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 10) {
                    this.trail.shift();
                }
                
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                // Slight homing behavior
                if (this.life > 200) {
                    const nearestRocket = this.findNearestRocket();
                    if (nearestRocket) {
                        const newAngle = Math.atan2(nearestRocket.y - this.y, nearestRocket.x - this.x);
                        this.angle = this.angle * 0.95 + newAngle * 0.05;
                        this.vx = Math.cos(this.angle) * this.speed;
                        this.vy = Math.sin(this.angle) * this.speed;
                    }
                }
            }
            
            findNearestRocket() {
                let nearest = null;
                let minDist = Infinity;
                
                rockets.forEach(rocket => {
                    const dist = Math.hypot(rocket.x - this.x, rocket.y - this.y);
                    if (dist < minDist && dist < 200) {
                        minDist = dist;
                        nearest = rocket;
                    }
                });
                
                return nearest;
            }
            
            draw() {
                // Draw trail
                ctx.strokeStyle = 'rgba(255, 100, 0, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    if (i === 0) {
                        ctx.moveTo(point.x, point.y);
                    } else {
                        ctx.lineTo(point.x, point.y);
                    }
                }
                ctx.stroke();
                
                // Draw missile body
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(-8, -3, 16, 6);
                
                // Nose cone
                ctx.fillStyle = '#ffff44';
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(12, -2);
                ctx.lineTo(12, 2);
                ctx.closePath();
                ctx.fill();
                
                // Fixed wings (main stabilizers)
                ctx.fillStyle = '#888';
                ctx.fillRect(-6, -6, 8, 3);  // Top wing
                ctx.fillRect(-6, 3, 8, 3);   // Bottom wing
                
                // Foldable wings (side fins)
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.moveTo(-4, -4);
                ctx.lineTo(-8, -6);
                ctx.lineTo(-6, -2);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(-4, 4);
                ctx.lineTo(-8, 6);
                ctx.lineTo(-6, 2);
                ctx.closePath();
                ctx.fill();
                
                // Exhaust
                ctx.fillStyle = 'orange';
                ctx.fillRect(-12, -2, 4, 4);
                
                ctx.restore();
            }
        }
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 150;
                this.maxLife = 150;
                this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.life--;
            }
            
            draw() {
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                ctx.globalAlpha = 1;
            }
        }
        
        function createFirework(x, y) {
            for (let i = 0; i < 30; i++) {
                fireworks.push(new Particle(x, y));
            }
            
            const texts = ['Hello World', '太空飯盒'];
            const randomText = texts[Math.floor(Math.random() * texts.length)];
            
            const textDuration = 180;
            setTimeout(() => {
                for (let frame = 0; frame < textDuration; frame++) {
                    setTimeout(() => {
                        ctx.font = 'bold 48px Arial';
                        ctx.fillStyle = `hsl(${(frame * 2) % 360}, 100%, ${70 + Math.sin(frame * 0.1) * 20}%)`;
                        ctx.strokeStyle = 'gold';
                        ctx.lineWidth = 3;
                        ctx.textAlign = 'center';
                        ctx.strokeText(randomText, x, y - 50);
                        ctx.fillText(randomText, x, y - 50);
                    }, frame * 16);
                }
            }, 0);
        }
        
        function activateMissileMode() {
            missileMode = true;
            missileModeTimer = 600; // 10 seconds at 60fps
            playLunchboxSound();
            
            // Create text effect
            setTimeout(() => {
                for (let frame = 0; frame < 120; frame++) {
                    setTimeout(() => {
                        ctx.font = 'bold 36px Arial';
                        ctx.fillStyle = `hsl(${(frame * 3) % 360}, 100%, 70%)`;
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.textAlign = 'center';
                        ctx.strokeText('MISSILE MODE ACTIVATED!', canvas.width/2, canvas.height/2 - 100);
                        ctx.fillText('MISSILE MODE ACTIVATED!', canvas.width/2, canvas.height/2 - 100);
                    }, frame * 16);
                }
            }, 0);
        }
        
        function activatePowerUp(type) {
            playPowerUpSound();
            
            if (type === 'dual') {
                weaponLevel = Math.min(2, weaponLevel + 1);
                setTimeout(() => {
                    for (let frame = 0; frame < 120; frame++) {
                        setTimeout(() => {
                            ctx.font = 'bold 32px Arial';
                            ctx.fillStyle = `hsl(${180 + (frame * 2) % 180}, 100%, 70%)`;
                            ctx.strokeStyle = 'white';
                            ctx.lineWidth = 2;
                            ctx.textAlign = 'center';
                            ctx.strokeText('DUAL GUNS ACTIVATED!', canvas.width/2, canvas.height/2 - 150);
                            ctx.fillText('DUAL GUNS ACTIVATED!', canvas.width/2, canvas.height/2 - 150);
                        }, frame * 16);
                    }
                }, 0);
            } else if (type === 'machine') {
                weaponLevel = 3;
                machineGunTimer = 900; // 15 seconds
                setTimeout(() => {
                    for (let frame = 0; frame < 120; frame++) {
                        setTimeout(() => {
                            ctx.font = 'bold 32px Arial';
                            ctx.fillStyle = `hsl(${300 + (frame * 3) % 60}, 100%, 70%)`;
                            ctx.strokeStyle = 'white';
                            ctx.lineWidth = 2;
                            ctx.textAlign = 'center';
                            ctx.strokeText('MACHINE GUN ACTIVATED!', canvas.width/2, canvas.height/2 - 150);
                            ctx.fillText('MACHINE GUN ACTIVATED!', canvas.width/2, canvas.height/2 - 150);
                        }, frame * 16);
                    }
                }, 0);
            }
        }
        
        function resetGame() {
            rockets = [];
            bullets = [];
            lasers = [];
            fireworks = [];
            lunchboxes = [];
            missiles = [];
            powerUps = [];
            score = 0;
            missedRockets = 0;
            gameState = 'playing';
            gameOverTime = 0;
            gameTimer = 60;
            gameStartTime = Date.now();
            pausedTime = 0;
            missileMode = false;
            missileModeTimer = 0;
            laserMode = false;
            laserModeTimer = 0;
            lunchboxHits = [];
            weaponLevel = 1;
            machineGunTimer = 0;
            isMouseDown = false;
            lastShotTime = 0;
            superWeaponUses = 2;
            superWeaponActive = false;
            superWeaponTimer = 0;
        }
        
        function togglePause() {
            if (gameState === 'playing') {
                gameState = 'paused';
                pausedTime = Date.now();
            } else if (gameState === 'paused') {
                gameState = 'playing';
                gameStartTime += Date.now() - pausedTime;
            }
        }
        
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') {
                togglePause();
            }
            if (e.key === 'b' || e.key === 'B') {
                activateSuperWeapon();
            }
        });

        function gameLoop() {
            ctx.fillStyle = 'rgba(0, 5, 15, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw background with scaling effect (approaching the moon)
            if (bgImg.complete && bgImg.naturalWidth > 0) {
                ctx.globalAlpha = 0.8;
                
                // Calculate scale based on elapsed time (1.0 to 1.5 over 60 seconds)
                const timeProgress = Math.min(1, (60 - gameTimer) / 60); // 0 to 1
                const scale = 1.0 + (timeProgress * 0.5); // 1.0 to 1.5
                
                const scaledWidth = canvas.width * scale;
                const scaledHeight = canvas.height * scale;
                const offsetX = (canvas.width - scaledWidth) / 2;
                const offsetY = (canvas.height - scaledHeight) / 2;
                
                ctx.drawImage(bgImg, offsetX, offsetY, scaledWidth, scaledHeight);
                ctx.globalAlpha = 1;
            }
            
            // Animated particle background
            const time = Date.now() * 0.001;
            ctx.globalAlpha = 0.3;
            
            for (let i = 0; i < 50; i++) {
                const x = (Math.sin(time * 0.5 + i * 0.5) * 200) + (canvas.width * 0.2) + (i * 15);
                const y = (Math.cos(time * 0.3 + i * 0.3) * 150) + (canvas.height * 0.3) + (i * 10);
                const size = Math.sin(time + i) * 2 + 3;
                const hue = (time * 50 + i * 10) % 360;
                ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
                ctx.beginPath();
                ctx.arc(x % canvas.width, y % canvas.height, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
            
            if (gameState === 'playing') {

                 // Super weapon visual effect
                if (superWeaponActive) {
                    const totalFrames = 45;
                    const progress = (totalFrames - superWeaponTimer) / totalFrames;
                    
                    // Phase 1: Lasers slide in (frames 0-20)
                    if (superWeaponTimer > 25) {
                        const laserProgress = (totalFrames - superWeaponTimer) / 20;
                        const leftX = -30 + (canvas.width * 0.3 * laserProgress);
                        const rightX = canvas.width + 30 - (canvas.width * 0.3 * laserProgress);
                        
                        // Red laser beams with glow
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = '#ff3333';
                        ctx.fillRect(leftX, 0, 25, canvas.height);
                        ctx.fillRect(rightX, 0, 25, canvas.height);
                        
                        // Inner bright core
                        ctx.fillStyle = '#ff6666';
                        ctx.fillRect(leftX + 5, 0, 15, canvas.height);
                        ctx.fillRect(rightX + 5, 0, 15, canvas.height);
                        
                        ctx.shadowBlur = 0;
                    }
                    
                    // Phase 2: Screen flash (frames 20-35)
                    if (superWeaponTimer <= 25 && superWeaponTimer > 10) {
                        const flashIntensity = (superWeaponTimer - 10) / 15;
                        ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity * 0.8})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        // Add some energy crackling effect
                        for (let i = 0; i < 10; i++) {
                            const x = Math.random() * canvas.width;
                            const y = Math.random() * canvas.height;
                            ctx.fillStyle = `rgba(0, 255, 255, ${flashIntensity})`;
                            ctx.fillRect(x, y, 3, 3);
                        }
                    }
                    
                    // Phase 3: Laser fade out (frames 35-45)
                    if (superWeaponTimer <= 10) {
                        const fadeIntensity = superWeaponTimer / 10;
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 15 * fadeIntensity;
                        ctx.fillStyle = `rgba(255, 51, 51, ${fadeIntensity})`;
                        ctx.fillRect(canvas.width * 0.25, 0, 25, canvas.height);
                        ctx.fillRect(canvas.width * 0.75 - 25, 0, 25, canvas.height);
                        ctx.shadowBlur = 0;
                    }
                    
                    superWeaponTimer--;
                    if (superWeaponTimer <= 0) {
                        superWeaponActive = false;
                    }
                }

                
                // Handle machine gun auto-fire
                if (weaponLevel === 3 && machineGunTimer > 0 && isMouseDown) {
                    const currentTime = Date.now();
                    if (currentTime - lastShotTime >= machineGunRate) {
                        shootWeapon(spaceship.x, spaceship.y);
                    }
                }
                
                // Update spaceship position
                spaceship.x += (spaceship.targetX - spaceship.x) * 0.1;
                spaceship.y += (spaceship.targetY - spaceship.y) * 0.1;
                
                const elapsedTime = Math.floor((Date.now() - gameStartTime) / 1000);
                gameTimer = Math.max(0, 60 - elapsedTime);
                
                if (gameTimer <= 0 && missedRockets < 10) {
                    gameState = 'youwin';
                    gameOverTime = Date.now();
                }
                
                // Update weapon timers
                if (machineGunTimer > 0) {
                    machineGunTimer--;
                    if (machineGunTimer <= 0) {
                        weaponLevel = Math.max(1, weaponLevel - 2); // Reset to single or stay at dual
                    }
                }
                
                // Update laser mode timer
                if (laserMode) {
                    laserModeTimer--;
                    if (laserModeTimer <= 0) {
                        laserMode = false;
                    }
                }
                
                // Clean old lunchbox hits (older than 3 seconds)
                const currentTime = Date.now();
                lunchboxHits = lunchboxHits.filter(time => currentTime - time < 3000);
                
                // Update missile mode timer
                if (missileMode) {
                    missileModeTimer--;
                    if (missileModeTimer <= 0) {
                        missileMode = false;
                    }
                    
                    // Auto-launch missiles at rockets
                    if (Math.random() < 0.1 && rockets.length > 0) {
                        const targetRocket = rockets[Math.floor(Math.random() * rockets.length)];
                        missiles.push(new Missile(targetRocket.x, targetRocket.y));
                        playMissileSound();
                    }
                }
                
                // Spawn rockets
                if (Math.random() < 0.02) {
                    rockets.push(new Rocket());
                }
                
                // Spawn lunchbox occasionally
                if (Math.random() < 0.005) {
                    lunchboxes.push(new Lunchbox());
                }
                
                // Spawn power-ups occasionally
                if (Math.random() < 0.003) {
                    powerUps.push(new PowerUp());
                }
                
                // Update rockets
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const rocket = rockets[i];
                    rocket.update();
                    rocket.draw();
                    
                    if (rocket.y < -50) {
                        rockets.splice(i, 1);
                        missedRockets++;
                        
                        if (missedRockets >= 10) {
                            gameState = 'gameover';
                            gameOverTime = Date.now();
                        }
                    }
                }
                
                // Update power-ups
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const powerUp = powerUps[i];
                    powerUp.update();
                    powerUp.draw();
                    
                    if (powerUp.y > canvas.height + 50) {
                        powerUps.splice(i, 1);
                    }
                }
                
                // Update lunchboxes
                for (let i = lunchboxes.length - 1; i >= 0; i--) {
                    const lunchbox = lunchboxes[i];
                    lunchbox.update();
                    lunchbox.draw();
                    
                    if (lunchbox.y > canvas.height + 50) {
                        lunchboxes.splice(i, 1);
                    }
                }
                
                // Update missiles
                for (let i = missiles.length - 1; i >= 0; i--) {
                    const missile = missiles[i];
                    missile.update();
                    missile.draw();
                    
                    if (missile.life <= 0 || missile.y < -50 || missile.x < -50 || missile.x > canvas.width + 50) {
                        missiles.splice(i, 1);
                        continue;
                    }
                    
                    // Check missile-rocket collision
                    for (let j = rockets.length - 1; j >= 0; j--) {
                        const rocket = rockets[j];
                        if (Math.hypot(missile.x - rocket.x, missile.y - rocket.y) < 30) {
                            createFirework(rocket.x, rocket.y);
                            playExplosionSound();
                            rockets.splice(j, 1);
                            missiles.splice(i, 1);
                            score += 2; // Double points for missile hits
                            break;
                        }
                    }
                }
                
                // Update lasers
                for (let i = lasers.length - 1; i >= 0; i--) {
                    const laser = lasers[i];
                    laser.update();
                    laser.draw();
                    
                    if (laser.y < 0) {
                        lasers.splice(i, 1);
                        continue;
                    }
                    
                    // Check laser-rocket collision
                    for (let j = rockets.length - 1; j >= 0; j--) {
                        const rocket = rockets[j];
                        if (Math.abs(laser.x - rocket.x) < 25 && Math.abs(laser.y - rocket.y) < 30) {
                            createFirework(rocket.x, rocket.y);
                            playExplosionSound();
                            rockets.splice(j, 1);
                            lasers.splice(i, 1);
                            score += 2; // Bonus points for laser
                            break;
                        }
                    }
                }
                
                // Update bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    bullet.update();
                    bullet.draw();
                    
                    if (bullet.y < 0) {
                        bullets.splice(i, 1);
                        continue;
                    }
                    
                    // Check bullet-rocket collision
                    for (let j = rockets.length - 1; j >= 0; j--) {
                        const rocket = rockets[j];
                        if (Math.abs(bullet.x - rocket.x) < 25 && Math.abs(bullet.y - rocket.y) < 30) {
                            createFirework(rocket.x, rocket.y);
                            playExplosionSound();
                            rockets.splice(j, 1);
                            bullets.splice(i, 1);
                            score++;
                            break;
                        }
                    }
                    
                    // Check bullet-power-up collision
                    for (let j = powerUps.length - 1; j >= 0; j--) {
                        const powerUp = powerUps[j];
                        if (Math.hypot(bullet.x - powerUp.x, bullet.y - powerUp.y) < 25) {
                            activatePowerUp(powerUp.type);
                            powerUps.splice(j, 1);
                            bullets.splice(i, 1);
                            score += 3; // Bonus points for power-up
                            break;
                        }
                    }
                    
                    // Check bullet-lunchbox collision
                    for (let j = lunchboxes.length - 1; j >= 0; j--) {
                        const lunchbox = lunchboxes[j];
                        if (Math.hypot(bullet.x - lunchbox.x, bullet.y - lunchbox.y) < 25) {
                            lunchboxHits.push(Date.now());
                            
                            // Check for double lunchbox hit
                            if (lunchboxHits.length >= 2) {
                                laserMode = true;
                                laserModeTimer = 600; // 10 seconds
                                lunchboxHits = []; // Reset counter
                            } else {
                                activateMissileMode();
                            }
                            
                            lunchboxes.splice(j, 1);
                            bullets.splice(i, 1);
                            score += 5; // Bonus points for lunchbox
                            break;
                        }
                    }
                }
            }
            
            // Draw spaceship with enhanced visual based on weapon level
            ctx.save();
            ctx.translate(spaceship.x, spaceship.y);
            
            // Main spaceship body
            ctx.fillStyle = weaponLevel === 3 ? '#ff00ff' : weaponLevel === 2 ? '#00ffff' : '#00ff88';
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-10, 10);
            ctx.lineTo(10, 10);
            ctx.closePath();
            ctx.fill();
            
            // Weapon indicators
            if (weaponLevel >= 2) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-12, 5, 4, 8); // Left gun
                ctx.fillRect(8, 5, 4, 8);  // Right gun
            }
            
            if (weaponLevel === 3) {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-2, 8, 4, 6); // Center gun
                
                // Machine gun glow effect
                if (machineGunTimer > 0) {
                    ctx.shadowColor = '#ff00ff';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(-12, 5, 24, 8);
                    ctx.shadowBlur = 0;
                }
            }
            
            ctx.restore();
            
            // Update fireworks
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const particle = fireworks[i];
                particle.update();
                particle.draw();
                
                if (particle.life <= 0) {
                    fireworks.splice(i, 1);
                }
            }
            
            // Draw timer
            ctx.font = 'bold 48px Arial';
            ctx.fillStyle = gameTimer <= 10 ? 'red' : 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.textAlign = 'center';
            ctx.strokeText(`${gameTimer}`, canvas.width/2, 60);
            ctx.fillText(`${gameTimer}`, canvas.width/2, 60);
            
            // Draw UI
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.fillText(`Score: ${score}`, 10, canvas.height - 150);
            ctx.fillText(`Missed: ${missedRockets}/10`, 10, canvas.height - 120);
            
            // Super weapon
            if (superWeaponUses > 0) {
                ctx.fillStyle = 'red';
                ctx.fillText(`Super Weapon (B): ${superWeaponUses} uses`, 10, canvas.height - 10);
            } else {
                ctx.fillStyle = 'gray';
                ctx.fillText(`Super Weapon: DEPLETED`, 10, canvas.height - 10);
            }

            // Weapon status
            let weaponText = 'Single Gun';
            if (weaponLevel === 2) weaponText = 'Dual Guns';
            if (weaponLevel === 3) weaponText = `Machine Gun (${Math.ceil(machineGunTimer / 60)}s)`;
            
            ctx.fillStyle = weaponLevel === 3 ? '#ff00ff' : weaponLevel === 2 ? '#00ffff' : '#ffffff';
            ctx.fillText(`Weapon: ${weaponText}`, 10, canvas.height - 90);
            
            if (missileMode) {
                ctx.fillStyle = 'lime';
                ctx.fillText(`Missile Mode: ${Math.ceil(missileModeTimer / 60)}s`, 10, canvas.height - 60);
            }
            
            if (laserMode) {
                ctx.fillStyle = 'cyan';
                ctx.fillText(`Laser Mode: ${Math.ceil(laserModeTimer / 60)}s`, 10, canvas.height - 30);
            }
            
            // Game over screen
            if (gameState === 'gameover') {
                ctx.font = 'bold 72px Arial';
                ctx.fillStyle = 'red';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText('GAME OVER', canvas.width/2, canvas.height/2);
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                
                ctx.font = '32px Arial';
                ctx.fillStyle = 'yellow';
                const timeLeft = 10 - Math.floor((Date.now() - gameOverTime) / 1000);
                ctx.fillText(`Restarting in ${timeLeft} seconds...`, canvas.width/2, canvas.height/2 + 80);
                
                if (Date.now() - gameOverTime > 10000) {
                    resetGame();
                }
            }
            
            // Pause screen
            if (gameState === 'paused') {
                ctx.font = 'bold 72px Arial';
                ctx.fillStyle = 'yellow';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText('PAUSED', canvas.width/2, canvas.height/2);
                ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
                
                ctx.font = '32px Arial';
                ctx.fillStyle = 'white';
                ctx.fillText('Press P or click PAUSE to resume', canvas.width/2, canvas.height/2 + 60);
            }
            
            // Win screen
            if (gameState === 'youwin') {
                ctx.font = 'bold 72px Arial';
                ctx.fillStyle = 'gold';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText('YOU WIN!', canvas.width/2, canvas.height/2);
                ctx.fillText('YOU WIN!', canvas.width/2, canvas.height/2);
                
                ctx.font = '32px Arial';
                ctx.fillStyle = 'yellow';
                const timeLeft = 10 - Math.floor((Date.now() - gameOverTime) / 1000);
                ctx.fillText(`Restarting in ${timeLeft} seconds...`, canvas.width/2, canvas.height/2 + 80);
                
                if (Date.now() - gameOverTime > 10000) {
                    resetGame();
                }
            }
            
            // Update pause button
            const pauseBtn = document.getElementById('pauseBtn');
            if (gameState === 'paused') {
                pauseBtn.textContent = 'RESUME';
                pauseBtn.style.background = '#FF9800';
            } else {
                pauseBtn.textContent = 'PAUSE';
                pauseBtn.style.background = '#4CAF50';
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
