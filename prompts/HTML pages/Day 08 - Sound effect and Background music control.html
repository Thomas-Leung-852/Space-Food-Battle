            } else if (wingmenFormation === 2) {
                // Front Guard
                if (activeCount >= 1) {
                    wingmen[0].baseOffsetX = -50;
                    wingmen[0].baseOffsetY = -40;
                }
                if (activeCount >= 2) {
                    wingmen[1].baseOffsetX = 50;
                    wingmen[1].baseOffsetY = -40;
                }
                if (activeCount >= 3) {
                    wingmen[2].baseOffsetX = -70;
                    wingmen[2].baseOffsetY = -20;
                }
                if (activeCount >= 4) {
                    wingmen[3].baseOffsetX = 70;
                    wingmen[3].baseOffsetY = -20;
                }
                wingmen.forEach(w => {
                    if (w.active) {
                        w.weaponType = 'spread';
                        w.fireRate = 1000;
                        w.orbitMode = false;
                    }
                });
            } else if (wingmenFormation === 3) {
                // Orbital Formation
                wingmen.forEach((w, index) => {
                    if (w.active) {
                        w.weaponType = 'bullet';
                        w.fireRate = 300;
                        w.orbitMode = true;
                        w.orbitRadius = 80;
                        w.orbitSpeed = 0.05;
                        w.orbitAngle = (Math.PI * 2 * index) / activeCount; // Evenly space them
                    }
                });
            }
            
            // Update actual offsets for non-orbit modes
            if (wingmenFormation !== 3) {
                wingmen.forEach(w => {
                    if (w.active) {
                        w.offsetX = w.baseOffsetX;
                        w.offsetY = w.baseOffsetY;
                    }
                });
            }
        }

        //Active Wingman Boost
        function activateWingmanBoost() {
            // Find first inactive wingman
            const inactiveWingman = wingmen.find(w => !w.active);
            
            if (inactiveWingman) {
                inactiveWingman.active = true;
                inactiveWingman.x = spaceship.x;
                inactiveWingman.y = spaceship.y;
                updateWingmenFormation();
                
                playPowerUpSound();
                
                // Visual effect
                setTimeout(() => {
                    for (let frame = 0; frame < 120; frame++) {
                        setTimeout(() => {
                            ctx.font = 'bold 32px Arial';
                            ctx.fillStyle = `hsl(${120 + (frame * 2) % 120}, 100%, 70%)`;
                            ctx.strokeStyle = 'white';
                            ctx.lineWidth = 2;
                            ctx.textAlign = 'center';
                            const activeCount = wingmen.filter(w => w.active).length;
                            ctx.strokeText(`WINGMAN REINFORCEMENT! (${activeCount}/4)`, canvas.width/2, canvas.height/2 - 150);
                            ctx.fillText(`WINGMAN REINFORCEMENT! (${activeCount}/4)`, canvas.width/2, canvas.height/2 - 150);
                        }, frame * 16);
                    }
                }, 0);
            } else {
                // All wingmen active - give bonus points instead
                score += 50;
                
                setTimeout(() => {
                    for (let frame = 0; frame < 90; frame++) {
                        setTimeout(() => {
                            ctx.font = 'bold 28px Arial';
                            ctx.fillStyle = `hsl(${(frame * 4) % 360}, 100%, 70%)`;
                            ctx.strokeStyle = 'white';
                            ctx.lineWidth = 2;
                            ctx.textAlign = 'center';
                            ctx.strokeText('MAX WINGMEN! +50 BONUS!', canvas.width/2, canvas.height/2 - 150);
                            ctx.fillText('MAX WINGMEN! +50 BONUS!', canvas.width/2, canvas.height/2 - 150);
                        }, frame * 16);
                    }
                }, 0);
            }
        }

        function resetGame() {
            rockets = [];
            bullets = [];
            lasers = [];
            fireworks = [];
            lunchboxes = [];
            missiles = [];
            powerUps = [];
            score = 0;
            missedRockets = 0;
            spaceshipHits = 0; // Reset spaceship hits
            gameState = 'playing';
            gameOverTime = 0;
            gameTimer = 60;
            gameStartTime = Date.now();
            pausedTime = 0;
            missileMode = false;
            missileModeTimer = 0;
            laserMode = false;
            laserModeTimer = 0;
            lunchboxHits = [];
            weaponLevel = 1;
            machineGunTimer = 0;
            isMouseDown = false;
            lastShotTime = 0;
            superWeaponUses = 2;
            superWeaponActive = false;
            superWeaponTimer = 0;
            invulnerable = false; // Reset invulnerability
            invulnerabilityTimer = 0;
            spaceship.rotation = 0; // Reset spaceship rotation
            // Reset key states
            keys.a = false;
            keys.d = false;
            keys.s = false;
            wingmen.forEach(w => w.lastShotTime = 0);
            spaceRocks = [];    // reset space rock
            spreadBullets = [];
            wingmanBoosts = [];
            wingmen.forEach((w, index) => {
                if (index < 2) {
                    w.active = true; // First 2 wingmen start active
                } else {
                    w.active = false; // Extra wingmen start inactive
                }
                w.lastShotTime = 0;
            });
        }
        
        function togglePause() {
            if (gameState === 'playing') {
                gameState = 'paused';
                pausedTime = Date.now();
                if (musicPlaying) bgMusic.pause();
            } else if (gameState === 'paused') {
                gameState = 'playing';
                gameStartTime += Date.now() - pausedTime;
                if (musicPlaying) bgMusic.play();
            }
        }
        
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('musicBtn').addEventListener('click', () => {
            toggleMusic();
            const btn = document.getElementById('musicBtn');
            btn.textContent = musicPlaying ? '🔊 MUSIC' : '🔇 MUSIC';
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') {
                togglePause();
            }
            if (e.key === 'b' || e.key === 'B') {
                activateSuperWeapon();
            }
            if (e.key === 'c' || e.key === 'C') {
                if (gameState === 'playing') {
                    wingmenFormation = (wingmenFormation + 1) % maxFormations;
                    updateWingmenFormation();
                    showFormationChange();
                    initAudio();
                    playFormationChangeSound();
                }
            }
            if (e.key === 'a' || e.key === 'A') {
                keys.a = true;
            }
            if (e.key === 'd' || e.key === 'D') {
                keys.d = true;
            }
            if (e.key === 's' || e.key === 'S') {
                spaceship.rotation = 0;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            // Release rotation controls
            if (e.key === 'a' || e.key === 'A') {
                keys.a = false;
            }
            if (e.key === 'd' || e.key === 'D') {
                keys.d = false;
            }
        });

        function gameLoop() {
            ctx.fillStyle = 'rgba(0, 5, 15, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw background with scaling effect (approaching the moon)
            if (bgImg.complete && bgImg.naturalWidth > 0) {
                ctx.globalAlpha = 0.8;
                
                // Calculate scale based on elapsed time (1.0 to 1.5 over 60 seconds)
                const timeProgress = Math.min(1, (60 - gameTimer) / 60); // 0 to 1
                const scale = 1.0 + (timeProgress * 0.5); // 1.0 to 1.5
                
                const scaledWidth = canvas.width * scale;
                const scaledHeight = canvas.height * scale;
                const offsetX = (canvas.width - scaledWidth) / 2;
                const offsetY = (canvas.height - scaledHeight) / 2;
                
                ctx.drawImage(bgImg, offsetX, offsetY, scaledWidth, scaledHeight);
                ctx.globalAlpha = 1;
            }
            
            // Animated particle background
            const time = Date.now() * 0.001;
            ctx.globalAlpha = 0.3;
            
            for (let i = 0; i < 50; i++) {
                const x = (Math.sin(time * 0.5 + i * 0.5) * 200) + (canvas.width * 0.2) + (i * 15);
                const y = (Math.cos(time * 0.3 + i * 0.3) * 150) + (canvas.height * 0.3) + (i * 10);
                const size = Math.sin(time + i) * 2 + 3;
                const hue = (time * 50 + i * 10) % 360;
                ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
                ctx.beginPath();
                ctx.arc(x % canvas.width, y % canvas.height, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
            
            if (gameState === 'playing') {



                 // Super weapon visual effect
                if (superWeaponActive) {
                    const totalFrames = 45;
                    const progress = (totalFrames - superWeaponTimer) / totalFrames;
                    
                    // Phase 1: Lasers slide in (frames 0-20)
                    if (superWeaponTimer > 25) {
                        const laserProgress = (totalFrames - superWeaponTimer) / 20;
                        const leftX = -30 + (canvas.width * 0.3 * laserProgress);
                        const rightX = canvas.width + 30 - (canvas.width * 0.3 * laserProgress);
                        
                        // Red laser beams with glow
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = '#ff3333';
                        ctx.fillRect(leftX, 0, 25, canvas.height);
                        ctx.fillRect(rightX, 0, 25, canvas.height);
                        
                        // Inner bright core
                        ctx.fillStyle = '#ff6666';
                        ctx.fillRect(leftX + 5, 0, 15, canvas.height);
                        ctx.fillRect(rightX + 5, 0, 15, canvas.height);
                        
                        ctx.shadowBlur = 0;
                    }
                    
                    // Phase 2: Screen flash (frames 20-35)
                    if (superWeaponTimer <= 25 && superWeaponTimer > 10) {
                        const flashIntensity = (superWeaponTimer - 10) / 15;
                        ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity * 0.8})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        // Add some energy crackling effect
                        for (let i = 0; i < 10; i++) {
                            const x = Math.random() * canvas.width;
                            const y = Math.random() * canvas.height;
                            ctx.fillStyle = `rgba(0, 255, 255, ${flashIntensity})`;
                            ctx.fillRect(x, y, 3, 3);
                        }
                    }
                    
                    // Phase 3: Laser fade out (frames 35-45)
                    if (superWeaponTimer <= 10) {
                        const fadeIntensity = superWeaponTimer / 10;
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 15 * fadeIntensity;
                        ctx.fillStyle = `rgba(255, 51, 51, ${fadeIntensity})`;
                        ctx.fillRect(canvas.width * 0.25, 0, 25, canvas.height);
                        ctx.fillRect(canvas.width * 0.75 - 25, 0, 25, canvas.height);
                        ctx.shadowBlur = 0;
                    }
                    
                    superWeaponTimer--;
                    if (superWeaponTimer <= 0) {
                        superWeaponActive = false;
                    }
                }

                // Update invulnerability timer
                if (invulnerable) {
                    invulnerabilityTimer--;
                    if (invulnerabilityTimer <= 0) {
                        invulnerable = false;
                    }
                }
                
                // Handle spaceship rotation controls
                const rotationSpeed = 0.08; // Rotation speed in radians per frame
                if (keys.a) {
                    spaceship.rotation -= rotationSpeed; // Rotate counter-clockwise
                }
                if (keys.d) {
                    spaceship.rotation += rotationSpeed; // Rotate clockwise
                }
                
                // Handle machine gun auto-fire
                if (weaponLevel === 3 && machineGunTimer > 0 && isMouseDown) {
                    const currentTime = Date.now();
                    if (currentTime - lastShotTime >= machineGunRate) {
                        shootWeapon(spaceship.x, spaceship.y);
                    }
                }
                
                // Update spaceship position
                spaceship.x += (spaceship.targetX - spaceship.x) * 0.1;
                spaceship.y += (spaceship.targetY - spaceship.y) * 0.1;
                
                const elapsedTime = Math.floor((Date.now() - gameStartTime) / 1000);
                gameTimer = Math.max(0, 60 - elapsedTime);
                
                if (gameTimer <= 0 && missedRockets < 10 && spaceshipHits < 5) {
                    gameState = 'youwin';
                    gameOverTime = Date.now();
                }
                
                // Update weapon timers
                if (machineGunTimer > 0) {
                    machineGunTimer--;
                    if (machineGunTimer <= 0) {
                        weaponLevel = Math.max(1, weaponLevel - 2); // Reset to single or stay at dual
                    }
                }
                
                // Update laser mode timer
                if (laserMode) {
                    laserModeTimer--;
                    if (laserModeTimer <= 0) {
                        laserMode = false;
                    }
                }
                
                // Clean old lunchbox hits (older than 3 seconds)
                const currentTime = Date.now();
                lunchboxHits = lunchboxHits.filter(time => currentTime - time < 3000);
                
                // Update missile mode timer
                if (missileMode) {
                    missileModeTimer--;
                    if (missileModeTimer <= 0) {
                        missileMode = false;
                    }
                    
                    // Auto-launch missiles at rockets
                    if (Math.random() < 0.1 && rockets.length > 0) {
                        const targetRocket = rockets[Math.floor(Math.random() * rockets.length)];
                        missiles.push(new Missile(targetRocket.x, targetRocket.y));
                        playMissileSound();
                    }
                }
                
                // Spawn rockets
                if (Math.random() < 0.02) {
                    rockets.push(new Rocket());
                }
                
                // Spawn lunchbox occasionally
                if (Math.random() < 0.005) {
                    lunchboxes.push(new Lunchbox());
                }
                
                // Spawn power-ups occasionally
                if (Math.random() < 0.003) {
                    powerUps.push(new PowerUp());
                }

                // Spawn Wingman Boost
                if (Math.random() < 0.002) {
                    wingmanBoosts.push(new WingmanBoost());
                }

                // Spawn space rocks occasionally
                if (Math.random() < 0.01) {
                    spaceRocks.push(new SpaceRock());
                }

                // Update rockets
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const rocket = rockets[i];
                    rocket.update();
                    rocket.draw();
                    
                    // Check rocket-spaceship collision (NEW LOGIC)
                    if (!invulnerable) {
                        const distance = Math.hypot(rocket.x - spaceship.x, rocket.y - spaceship.y);
                        if (distance < 35) { // Collision detected
                            spaceshipHits++;
                            invulnerable = true;
                            invulnerabilityTimer = 120; // 2 seconds of invulnerability at 60fps
                            
                            playSpaceshipHitSound();
                            
                            // Create hit effect particles
                            for (let j = 0; j < 15; j++) {
                                fireworks.push(new Particle(spaceship.x, spaceship.y));
                            }
                            
                            rockets.splice(i, 1);
                            
                            // Check if game over due to hits
                            if (spaceshipHits >= 5) {
                                gameState = 'gameover';
                                gameOverTime = Date.now();
                            }
                            continue;
                        }
                    }
                    
                    if (rocket.y < -50) {
                        rockets.splice(i, 1);
                        missedRockets++;
                        
                        if (missedRockets >= 10) {
                            gameState = 'gameover';
                            gameOverTime = Date.now();
                        }
                    }
                }
                
                // Update space rocks
                for (let i = spaceRocks.length - 1; i >= 0; i--) {
                    const rock = spaceRocks[i];
                    rock.update();
                    rock.draw();
                    
                    // Check rock-spaceship collision
                    if (!invulnerable) {
                        const distance = Math.hypot(rock.x - spaceship.x, rock.y - spaceship.y);
                        if (distance < rock.size / 2 + 20) {
                            spaceshipHits++;
                            invulnerable = true;
                            invulnerabilityTimer = 120;
                            
                            playSpaceshipHitSound();
                            
                            // Create hit effect particles
                            for (let j = 0; j < 15; j++) {
                                fireworks.push(new Particle(spaceship.x, spaceship.y));
                            }
                            
                            spaceRocks.splice(i, 1);
                            
                            if (spaceshipHits >= 5) {
                                gameState = 'gameover';
                                gameOverTime = Date.now();
                            }
                            continue;
                        }
                    }
                    
                    // Remove rocks that go off screen
                    if (rock.y > canvas.height + 100) {
                        spaceRocks.splice(i, 1);
                    }
                }

                // Update power-ups
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const powerUp = powerUps[i];
                    powerUp.update();
                    powerUp.draw();
                    
                    if (powerUp.y > canvas.height + 50) {
                        powerUps.splice(i, 1);
                    }
                }
                
                // Update Wingman Boosts
                for (let i = wingmanBoosts.length - 1; i >= 0; i--) {
                    const boost = wingmanBoosts[i];

                    if(boost != null){
                        boost.update();
                        boost.draw();
                        
                        if (boost.y > canvas.height + 50) {
                            wingmanBoosts.splice(i, 1);
                        }
                    }
                }

                // Check spaceship collision with wingman boosts
                for (let i = wingmanBoosts.length - 1; i >= 0; i--) {
                    const boost = wingmanBoosts[i];
                    
                    if (!boost.collected) {
                        const distance = Math.hypot(boost.x - spaceship.x, boost.y - spaceship.y);
                        
                        if (distance < 40) { // Spaceship collision
                            boost.collected = true;
                            activateWingmanBoost();
                            wingmanBoosts.splice(i, 1);
                            score += 5;
                            
                            // Create collection particles
                            for (let j = 0; j < 20; j++) {
                                fireworks.push(new Particle(boost.x, boost.y));
                            }
                            
                            playPowerUpSound();
                            break;
                        }
                    }
                }

                // Update lunchboxes
                for (let i = lunchboxes.length - 1; i >= 0; i--) {
                    const lunchbox = lunchboxes[i];
                    lunchbox.update();
                    lunchbox.draw();
                    
                    if (lunchbox.y > canvas.height + 50) {
                        lunchboxes.splice(i, 1);
                    }
                }
                
                // Update missiles
                for (let i = missiles.length - 1; i >= 0; i--) {
                    const missile = missiles[i];
                    missile.update();
                    missile.draw();
                    
                    if (missile.life <= 0 || missile.y < -50 || missile.x < -50 || missile.x > canvas.width + 50) {
                        missiles.splice(i, 1);
                        continue;
                    }
                    
                    // Check missile-rocket collision
                    for (let j = rockets.length - 1; j >= 0; j--) {
                        const rocket = rockets[j];
                        if (Math.hypot(missile.x - rocket.x, missile.y - rocket.y) < 30) {
                            createFirework(rocket.x, rocket.y);
                            playExplosionSound();
                            rockets.splice(j, 1);
                            missiles.splice(i, 1);
                            score += 2; // Double points for missile hits
                            break;
                        }
                    }
                }
                
                // Update lasers
                for (let i = lasers.length - 1; i >= 0; i--) {
                    const laser = lasers[i];
                    laser.update();
                    laser.draw();
                    
                    if (laser.y < 0) {
                        lasers.splice(i, 1);
                        continue;
                    }
                    
                    // Check laser-rocket collision
                    for (let j = rockets.length - 1; j >= 0; j--) {
                        const rocket = rockets[j];
                        if (Math.abs(laser.x - rocket.x) < 25 && Math.abs(laser.y - rocket.y) < 30) {
                            createFirework(rocket.x, rocket.y);
                            playExplosionSound();
                            rockets.splice(j, 1);
                            lasers.splice(i, 1);
                            score += 2; // Bonus points for laser
                            break;
                        }
                    }

                    // Check laser-space rock collision
                    for (let j = spaceRocks.length - 1; j >= 0; j--) {
                        const rock = spaceRocks[j];
                        const distance = Math.hypot(laser.x - rock.x, laser.y - rock.y);
                        if (distance < rock.size / 2 + 10) {
                            rock.health--;
                            rock.hitFlash = 10;
                            playRockHitSound();
                            lasers.splice(i, 1);
                            
                            if (rock.health <= 0) {
                                createFirework(rock.x, rock.y);
                                playExplosionSound();
                                spaceRocks.splice(j, 1);
                                score += 10;
                            }
                            break;
                        }
                    }

                    // Check laser-wingman boost collision (add in the laser update section)
                    for (let j = wingmanBoosts.length - 1; j >= 0; j--) {
                        const boost = wingmanBoosts[j];
                        
                        if (!boost.collected && Math.hypot(laser.x - boost.x, laser.y - boost.y) < 30) {
                            boost.applyKnockback(laser.x, laser.y);
                            playDingSound();
                            lasers.splice(i, 1);
                            
                            if (boost.hitCount >= boost.maxHits) {
                                boost.collected = true;
                                activateWingmanBoost();
                                wingmanBoosts.splice(j, 1);
                                score += 5;
                                
                                for (let k = 0; k < 15; k++) {
                                    fireworks.push(new Particle(boost.x, boost.y));
                                }
                            }
                            break;
                        }
                    }
                }
                
                // Update bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    bullet.update();
                    bullet.draw();
                    
                    if (bullet.y < 0) {
                        bullets.splice(i, 1);
                        continue;
                    }
                    
                    // Check bullet-rocket collision
                    for (let j = rockets.length - 1; j >= 0; j--) {
                        const rocket = rockets[j];
                        if (Math.abs(bullet.x - rocket.x) < 25 && Math.abs(bullet.y - rocket.y) < 30) {
                            createFirework(rocket.x, rocket.y);
                            playExplosionSound();
                            rockets.splice(j, 1);
                            bullets.splice(i, 1);
                            score++;
                            break;
                        }
                    }
                    
                    // Check bullet-power-up collision
                    for (let j = powerUps.length - 1; j >= 0; j--) {
                        const powerUp = powerUps[j];
                        if (Math.hypot(bullet.x - powerUp.x, bullet.y - powerUp.y) < 25) {
                            activatePowerUp(powerUp.type);
                            powerUps.splice(j, 1);
                            bullets.splice(i, 1);
                            score += 3; // Bonus points for power-up
                            break;
                        }
                    }
                    
                    // Check bullet-lunchbox collision
                    for (let j = lunchboxes.length - 1; j >= 0; j--) {
                        const lunchbox = lunchboxes[j];
                        if (Math.hypot(bullet.x - lunchbox.x, bullet.y - lunchbox.y) < 25) {
                            lunchboxHits.push(Date.now());
                            
                            // Check for double lunchbox hit
                            if (lunchboxHits.length >= 2) {
                                laserMode = true;
                                laserModeTimer = 600; // 10 seconds
                                lunchboxHits = []; // Reset counter
                            } else {
                                activateMissileMode();
                            }
                            
                            lunchboxes.splice(j, 1);
                            bullets.splice(i, 1);
                            score += 5; // Bonus points for lunchbox
                            break;
                        }
                    }

                    // Check bullet-wingman boost collision
                    for (let j = wingmanBoosts.length - 1; j >= 0; j--) {
                        const boost = wingmanBoosts[j];
                        
                        if (!boost.collected && Math.hypot(bullet.x - boost.x, bullet.y - boost.y) < 30) {
                            boost.applyKnockback(bullet.x, bullet.y);
                            playDingSound();
                            bullets.splice(i, 1);
                            
                            // Check if enough hits to collect
                            if (boost.hitCount >= boost.maxHits) {
                                boost.collected = true;
                                activateWingmanBoost();
                                wingmanBoosts.splice(j, 1);
                                score += 5;
                                
                                // Create collection particles
                                for (let k = 0; k < 15; k++) {
                                    fireworks.push(new Particle(boost.x, boost.y));
                                }
                            }
                            break;
                        }
                    }    

                    // Check bullet-space rock collision
                    for (let j = spaceRocks.length - 1; j >= 0; j--) {
                        const rock = spaceRocks[j];
                        const distance = Math.hypot(bullet.x - rock.x, bullet.y - rock.y);
                        if (distance < rock.size / 2 + 5) {
                            rock.health--;
                            rock.hitFlash = 10;
                            playRockHitSound();
                            bullets.splice(i, 1);
                            
                            if (rock.health <= 0) {
                                // Rock destroyed
                                createFirework(rock.x, rock.y);
                                playExplosionSound();
                                spaceRocks.splice(j, 1);
                                score += 10; // Bonus points for destroying a rock
                            }
                            break;
                        }
                    }
                }

                // Update spread bullets
                for (let i = spreadBullets.length - 1; i >= 0; i--) {
                    const bullet = spreadBullets[i];
                    bullet.update();
                    bullet.draw();
                    
                    if (bullet.y < 0 || bullet.x < 0 || bullet.x > canvas.width) {
                        spreadBullets.splice(i, 1);
                        continue;
                    }
                    
                    // Check spread bullet-rocket collision
                    for (let j = rockets.length - 1; j >= 0; j--) {
                        const rocket = rockets[j];
                        if (Math.abs(bullet.x - rocket.x) < 25 && Math.abs(bullet.y - rocket.y) < 30) {
                            createFirework(rocket.x, rocket.y);
                            playExplosionSound();
                            rockets.splice(j, 1);
                            spreadBullets.splice(i, 1);
                            score++;
                            break;
                        }
                    }
                    
                    // Check spread bullet-space rock collision
                    for (let j = spaceRocks.length - 1; j >= 0; j--) {
                        const rock = spaceRocks[j];
                        const distance = Math.hypot(bullet.x - rock.x, bullet.y - rock.y);
                        if (distance < rock.size / 2 + 5) {
                            rock.health--;
                            rock.hitFlash = 10;
                            playRockHitSound();
                            spreadBullets.splice(i, 1);
                            
                            if (rock.health <= 0) {
                                createFirework(rock.x, rock.y);
                                playExplosionSound();
                                spaceRocks.splice(j, 1);
                                score += 10;
                            }
                            break;
                        }
                    }

                    // Check spread bullet-wingman boost collision
                    for (let j = wingmanBoosts.length - 1; j >= 0; j--) {
                        const boost = wingmanBoosts[j];
                        
                        if (!boost.collected && Math.hypot(bullet.x - boost.x, bullet.y - boost.y) < 30) {
                            boost.applyKnockback(bullet.x, bullet.y);
                            playDingSound();
                            spreadBullets.splice(i, 1);
                            
                            if (boost.hitCount >= boost.maxHits) {
                                boost.collected = true;
                                activateWingmanBoost();
                                wingmanBoosts.splice(j, 1);
                                score += 5;
                                
                                for (let k = 0; k < 15; k++) {
                                    fireworks.push(new Particle(boost.x, boost.y));
                                }
                            }
                            break;
                        }
                    }
                }

                //Update wingmen
                wingmen.forEach(w => {
                    if (!w.active) return;
                    
                    if (w.orbitMode) {
                        // Orbital movement
                        w.orbitAngle += w.orbitSpeed;
                        
                        // Calculate position relative to spaceship with rotation
                        const cos = Math.cos(spaceship.rotation);
                        const sin = Math.sin(spaceship.rotation);
                        
                        const localX = Math.cos(w.orbitAngle) * w.orbitRadius;
                        const localY = Math.sin(w.orbitAngle) * w.orbitRadius;
                        
                        // Apply spaceship rotation to orbit
                        w.targetX = spaceship.x + (cos * localX - sin * localY);
                        w.targetY = spaceship.y + (sin * localX + cos * localY);
                        
                        // Smooth follow
                        w.x += (w.targetX - w.x) * 0.2;
                        w.y += (w.targetY - w.y) * 0.2;
                    } else {
                        // Standard formation movement
                        const cos = Math.cos(spaceship.rotation);
                        const sin = Math.sin(spaceship.rotation);
                        w.targetX = spaceship.x + (cos * w.offsetX - sin * w.offsetY);
                        w.targetY = spaceship.y + (sin * w.offsetX + cos * w.offsetY);
                        w.x += (w.targetX - w.x) * 0.15;
                        w.y += (w.targetY - w.y) * 0.15;
                    }
                    
                    if (rockets.length > 0 && Date.now() - w.lastShotTime >= w.fireRate) {
                        w.lastShotTime = Date.now();
                        
                        if (w.weaponType === 'bullet') {
                            bullets.push(new Bullet(w.x, w.y, spaceship.rotation));
                            playShootSound();
                        } else if (w.weaponType === 'spread') {
                            const spreadAngles = [-0.3, -0.15, 0, 0.15, 0.3];
                            spreadAngles.forEach(angle => {
                                spreadBullets.push(new SpreadBullet(w.x, w.y, spaceship.rotation, angle));
                            });
                            playShootSound();
                        }
                    }
                });

                // Check wingmen collisions with rockets
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const rocket = rockets[i];
                    
                    for (let w = 0; w < wingmen.length; w++) {
                        const wingman = wingmen[w];
                        if (!wingman.active) continue;
                        
                        const distance = Math.hypot(rocket.x - wingman.x, rocket.y - wingman.y);
                        if (distance < 30) {
                            // Wingman destroyed
                            wingman.active = false;
                            
                            // Create explosion effect
                            for (let j = 0; j < 20; j++) {
                                fireworks.push(new Particle(wingman.x, wingman.y));
                            }
                            
                            playWingmanDestroyedSound();
                            rockets.splice(i, 1);
                            break;
                        }
                    }
                }

                // Check wingmen collisions with space rocks
                for (let i = spaceRocks.length - 1; i >= 0; i--) {
                    const rock = spaceRocks[i];
                    
                    for (let w = 0; w < wingmen.length; w++) {
                        const wingman = wingmen[w];
                        if (!wingman.active) continue;
                        
                        const distance = Math.hypot(rock.x - wingman.x, rock.y - wingman.y);
                        if (distance < rock.size / 2 + 15) {
                            // Wingman destroyed
                            wingman.active = false;
                            
                            // Create explosion effect
                            for (let j = 0; j < 20; j++) {
                                fireworks.push(new Particle(wingman.x, wingman.y));
                            }
                            
                            playWingmanDestroyedSound();
                            // Rock continues (doesn't get destroyed by wingman collision)
                            break;
                        }
                    }
                }

            }
            
            // Draw spaceship with enhanced visual based on weapon level and invulnerability
            ctx.save();
            ctx.translate(spaceship.x, spaceship.y);
            ctx.rotate(spaceship.rotation); // Apply rotation
            
            // Blinking effect when invulnerable
            if (invulnerable && Math.floor(invulnerabilityTimer / 10) % 2 === 0) {
                ctx.globalAlpha = 0.3;
            }
            
            // Main spaceship body (triangle pointing up)
            ctx.fillStyle = weaponLevel === 3 ? '#ff00ff' : weaponLevel === 2 ? '#00ffff' : '#00ff88';
            ctx.beginPath();
            ctx.moveTo(0, -15); // Nose (pointing up)
            ctx.lineTo(-10, 10); // Bottom left
            ctx.lineTo(10, 10);  // Bottom right
            ctx.closePath();
            ctx.fill();
            
            // Add a small body detail
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, -5, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Weapon indicators
            if (weaponLevel >= 2) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-12, 5, 4, 8); // Left gun
                ctx.fillRect(8, 5, 4, 8);  // Right gun
            }
            
            if (weaponLevel === 3) {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-2, 8, 4, 6); // Center gun
                
                // Machine gun glow effect
                if (machineGunTimer > 0) {
                    ctx.shadowColor = '#ff00ff';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(-12, 5, 24, 8);
                    ctx.shadowBlur = 0;
                }
            }
            
            // Rotation indicator (small line showing front direction)
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(0, -20);
            ctx.stroke();
            
            ctx.restore();
            ctx.globalAlpha = 1;
            
            // Update fireworks
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const particle = fireworks[i];
                particle.update();
                particle.draw();
                
                if (particle.life <= 0) {
                    fireworks.splice(i, 1);
                }
            }
            
            // Draw wingmen with weapon-specific colors
            wingmen.forEach(w => {
                if (!w.active) return; // Skip inactive wingmen
                
                ctx.save();
                ctx.translate(w.x, w.y);
                ctx.rotate(spaceship.rotation);
                
                if (invulnerable && Math.floor(invulnerabilityTimer/10) % 2 === 0) ctx.globalAlpha = 0.3;
                
                // Different colors based on weapon type
                let wingmanColor = '#fa0';
                if (w.weaponType === 'spread') {
                    wingmanColor = '#f0f';
                } else if (w.fireRate < 300) {
                    wingmanColor = '#4af';
                }
                
                ctx.fillStyle = wingmanColor;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(-7, 7);
                ctx.lineTo(7, 7);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, -3, 2, 0, Math.PI*2);
                ctx.fill();
                
                if (w.weaponType === 'spread') {
                    ctx.fillStyle = '#f0f';
                    ctx.fillRect(-8, 5, 2, 5);
                    ctx.fillRect(-3, 5, 2, 5);
                    ctx.fillRect(1, 5, 2, 5);
                    ctx.fillRect(6, 5, 2, 5);
                    ctx.shadowColor = '#f0f';
                    ctx.shadowBlur = 6;
                    ctx.fillRect(-8, 5, 14, 5);
                    ctx.shadowBlur = 0;
                } else if (w.fireRate < 300) {
                    ctx.fillStyle = '#0ff';
                    ctx.fillRect(-3, 5, 2, 5);
                    ctx.fillRect(1, 5, 2, 5);
                } else {
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(-2, 5, 4, 4);
                }
                
                ctx.restore();
                ctx.globalAlpha = 1;
            });

            // Draw timer
            ctx.font = 'bold 48px Arial';
            ctx.fillStyle = gameTimer <= 10 ? 'red' : 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.textAlign = 'center';
            ctx.strokeText(`${gameTimer}`, canvas.width/2, 60);
            ctx.fillText(`${gameTimer}`, canvas.width/2, 60);
            
            // Draw UI
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.fillText(`Score: ${score}`, 10, canvas.height - 180);
            ctx.fillText(`Missed: ${missedRockets}/10`, 10, canvas.height - 150);
            
            // NEW: Display spaceship hits
            ctx.fillStyle = spaceshipHits >= 4 ? 'red' : spaceshipHits >= 3 ? 'orange' : 'white';
            ctx.fillText(`Hits: ${spaceshipHits}/5`, 10, canvas.height - 120);
            
            // Display wingmen formation with weapon type
            ctx.font = '20px Arial';
            ctx.fillStyle = '#ffaa00';
            ctx.textAlign = 'left';
            let formationInfo = [
                'V-Formation (Standard Fire)', 
                'Line Formation (Rapid Fire)', 
                'Front Guard (Spread Shot)'
            ][wingmenFormation];
            ctx.fillText(`Formation (C): ${formationInfo}`, 10, canvas.height - 240);

            // Display wingmen status
            ctx.font = '20px Arial';
            ctx.textAlign = 'left';
            const activeWingmen = wingmen.filter(w => w.active).length;
            ctx.fillStyle = activeWingmen === 2 ? '#00ff00' : activeWingmen === 1 ? '#ffaa00' : '#ff0000';
            ctx.fillText(`Wingmen: ${activeWingmen}/2`, 10, canvas.height - 270);

            // Super weapon
            if (superWeaponUses > 0) {
                ctx.fillStyle = 'red';
                ctx.fillText(`Super Weapon (B): ${superWeaponUses} uses`, 10, canvas.height - 10);
            } else {
                ctx.fillStyle = 'gray';
                ctx.fillText(`Super Weapon: DEPLETED`, 10, canvas.height - 10);
            }

            // Weapon status
            let weaponText = 'Single Gun';
            if (weaponLevel === 2) weaponText = 'Dual Guns';
            if (weaponLevel === 3) weaponText = `Machine Gun (${Math.ceil(machineGunTimer / 60)}s)`;
            
            ctx.fillStyle = weaponLevel === 3 ? '#ff00ff' : weaponLevel === 2 ? '#00ffff' : '#ffffff';
            ctx.fillText(`Weapon: ${weaponText}`, 10, canvas.height - 90);
            
            if (missileMode) {
                ctx.fillStyle = 'lime';
                ctx.fillText(`Missile Mode: ${Math.ceil(missileModeTimer / 60)}s`, 10, canvas.height - 60);
            }
            
            if (laserMode) {
                ctx.fillStyle = 'cyan';
                ctx.fillText(`Laser Mode: ${Math.ceil(laserModeTimer / 60)}s`, 10, canvas.height - 30);
            }
            
            // Game over screen
            if (gameState === 'gameover') {
                ctx.font = 'bold 72px Arial';
                ctx.fillStyle = 'red';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText('GAME OVER', canvas.width/2, canvas.height/2);
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                
                ctx.font = '32px Arial';
                ctx.fillStyle = 'yellow';
                
                // Show reason for game over
                if (spaceshipHits >= 5) {
                    ctx.fillText('Too many hits!', canvas.width/2, canvas.height/2 + 50);
                } else if (missedRockets >= 10) {
                    ctx.fillText('Too many rockets missed!', canvas.width/2, canvas.height/2 + 50);
                }
                
                const timeLeft = 10 - Math.floor((Date.now() - gameOverTime) / 1000);
                ctx.fillText(`Restarting in ${timeLeft} seconds...`, canvas.width/2, canvas.height/2 + 80);
                
                if (Date.now() - gameOverTime > 10000) {
                    resetGame();
                }
            }
            
            // Pause screen
            if (gameState === 'paused') {
                ctx.font = 'bold 72px Arial';
                ctx.fillStyle = 'yellow';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText('PAUSED', canvas.width/2, canvas.height/2);
                ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
                
                ctx.font = '32px Arial';
                ctx.fillStyle = 'white';
                ctx.fillText('Press P or click PAUSE to resume', canvas.width/2, canvas.height/2 + 60);
            }
            
            // Win screen
            if (gameState === 'youwin') {
                ctx.font = 'bold 72px Arial';
                ctx.fillStyle = 'gold';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText('YOU WIN!', canvas.width/2, canvas.height/2);
                ctx.fillText('YOU WIN!', canvas.width/2, canvas.height/2);
                
                ctx.font = '32px Arial';
                ctx.fillStyle = 'yellow';
                const timeLeft = 10 - Math.floor((Date.now() - gameOverTime) / 1000);
                ctx.fillText(`Restarting in ${timeLeft} seconds...`, canvas.width/2, canvas.height/2 + 80);
                
                if (Date.now() - gameOverTime > 10000) {
                    resetGame();
                }
            }
            
            // Update pause button
            const pauseBtn = document.getElementById('pauseBtn');
            if (gameState === 'paused') {
                pauseBtn.textContent = 'RESUME';
                pauseBtn.style.background = '#FF9800';
            } else {
                pauseBtn.textContent = 'PAUSE';
                pauseBtn.style.background = '#4CAF50';
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
