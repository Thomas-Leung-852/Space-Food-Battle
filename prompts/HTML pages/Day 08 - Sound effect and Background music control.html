<!DOCTYPE html>
<html>

            font-family: Arial; 
        }

        }

    <canvas id="game"></canvas>

        let spaceRocks = []; //space rocks

        let wingmen = [
            {

        // Wingmen formation
        let wingmenFormation = 0; // 0 = behind, 1 = vertical line, 2 = front guard
        updateWingmenFormation();
        const maxFormations = 4;

        // Setup Background music :: Begin
        // Array of background music URLs
        const bgMusicTracks = [
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Phantom%20from%20Space.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Space%20Jazz.mp3',

        ];

        // Select random track
        const randomTrackIndex = Math.floor(Math.random() * bgMusicTracks.length);
        let currentTrackIndex = randomTrackIndex;

        // Create audio element with random track
        let bgMusic = document.getElementById('bgMusic');
        bgMusic.src = bgMusicTracks[currentTrackIndex];

        // Music Control variables (keep existing ones)
        let musicPlaying = false;
        let musicVolume = 0.3; // 30% volume

        // Add track switching on music end
        bgMusic.addEventListener('ended', () => {
            // Play next random track
            currentTrackIndex = Math.floor(Math.random() * bgMusicTracks.length);
            bgMusic.src = bgMusicTracks[currentTrackIndex];
            if (musicPlaying) {
                bgMusic.play().catch(e => console.log('Audio play failed:', e));
            }
        });
        // Setup Background music :: End

        // Power-up system
        let weaponLevel = 1; // 1 = single, 2 = dual, 3 = machine gun
        let machineGunTimer = 0;
        let isMouseDown = false;
        let lastShotTime = 0;
        const machineGunRate = 100, wingmanShootRate = 500; // milliseconds between shots
        
        // Spaceship variables
        let spaceship = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            targetX: canvas.width / 2,
            targetY: canvas.height - 100,
            size: 30,
            rotation: 0, // New: rotation angle in radians
            thrustParticles: []
        };
        
        // Key tracking for rotation controls
        let keys = {
            a: false,
            d: false,
            s: false
        };
        
        // Mouse tracking and controls
        canvas.addEventListener('mousemove', (e) => {
            spaceship.targetX = e.clientX;
            spaceship.targetY = e.clientY;
        });
        
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            if (gameState === 'playing') {
                initAudio();
                shootWeapon(e.clientX, e.clientY);
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isMouseDown = false;
        });
        
        // Prevent context menu on right click
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        let audioContext;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Start background music on first user interaction
            startMusic();
        }
        
        function playShootSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }
        
        function playExplosionSound() {
            if (!audioContext) return;
            const oscillator1 = audioContext.createOscillator();
            const gainNode1 = audioContext.createGain();
            oscillator1.connect(gainNode1);
            gainNode1.connect(audioContext.destination);
            oscillator1.type = 'sawtooth';
            oscillator1.frequency.setValueAtTime(150, audioContext.currentTime);
            oscillator1.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.3);
            gainNode1.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            oscillator1.start(audioContext.currentTime);
            oscillator1.stop(audioContext.currentTime + 0.3);
        }
        
        function playMissileSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }
        
        function playLunchboxSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1500, audioContext.currentTime + 0.15);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }
        
        function playPowerUpSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.1);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        // New function for spaceship hit sound
        function playSpaceshipHitSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.4);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.4);
        }
        
       function playSuperWeaponSound() {
            if (!audioContext) return;
            
            // Phase 1: Deep charging rumble (0-300ms)
            const lowRumble = audioContext.createOscillator();
            const lowGain = audioContext.createGain();
            lowRumble.connect(lowGain);
            lowGain.connect(audioContext.destination);
            
            lowRumble.type = 'sawtooth';
            lowRumble.frequency.setValueAtTime(60, audioContext.currentTime);
            lowRumble.frequency.exponentialRampToValueAtTime(120, audioContext.currentTime + 0.3);
            lowGain.gain.setValueAtTime(0.2, audioContext.currentTime);
            lowGain.gain.exponentialRampToValueAtTime(0.4, audioContext.currentTime + 0.3);
            
            lowRumble.start(audioContext.currentTime);
            lowRumble.stop(audioContext.currentTime + 0.3);
            
            // Phase 2: High energy buildup (150-450ms)
            setTimeout(() => {
                const highCharge = audioContext.createOscillator();
                const highGain = audioContext.createGain();
                highCharge.connect(highGain);
                highGain.connect(audioContext.destination);
                
                highCharge.type = 'square';
                highCharge.frequency.setValueAtTime(400, audioContext.currentTime);
                highCharge.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.3);
                highGain.gain.setValueAtTime(0.1, audioContext.currentTime);
                highGain.gain.exponentialRampToValueAtTime(0.3, audioContext.currentTime + 0.2);
                highGain.gain.exponentialRampToValueAtTime(0.05, audioContext.currentTime + 0.3);
                
                highCharge.start(audioContext.currentTime);
                highCharge.stop(audioContext.currentTime + 0.3);
            }, 150);
            
            // Phase 3: Massive explosion (500ms)
            setTimeout(() => {
                // Low frequency boom
                const boom = audioContext.createOscillator();
                const boomGain = audioContext.createGain();
                boom.connect(boomGain);
                boomGain.connect(audioContext.destination);
                
                boom.type = 'sawtooth';
                boom.frequency.setValueAtTime(80, audioContext.currentTime);
                boom.frequency.exponentialRampToValueAtTime(30, audioContext.currentTime + 0.5);
                boomGain.gain.setValueAtTime(0.5, audioContext.currentTime);
                boomGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                boom.start(audioContext.currentTime);
                boom.stop(audioContext.currentTime + 0.5);
                
                // High frequency crackle
                const crackle = audioContext.createOscillator();
                const crackleGain = audioContext.createGain();
                crackle.connect(crackleGain);
                crackleGain.connect(audioContext.destination);
                
                crackle.type = 'square';
                crackle.frequency.setValueAtTime(2000, audioContext.currentTime);
                crackle.frequency.exponentialRampToValueAtTime(500, audioContext.currentTime + 0.3);
                crackleGain.gain.setValueAtTime(0.2, audioContext.currentTime);
                crackleGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                crackle.start(audioContext.currentTime);
                crackle.stop(audioContext.currentTime + 0.3);
            }, 500);
        }

        //Play Space Rock hit sound
        function playRockHitSound() {

        // play Wingman Destroyed Sound
        function playWingmanDestroyedSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.25, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // play ding sound
        function playDingSound() {
            if (!audioContext) return;
            
            // Create a pleasant "ding" sound with harmonics
            const oscillator1 = audioContext.createOscillator();
            const oscillator2 = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator1.connect(gainNode);
            oscillator2.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Base frequency
            oscillator1.type = 'sine';
            oscillator1.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator1.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
            
            // Harmonic frequency
            oscillator2.type = 'sine';
            oscillator2.frequency.setValueAtTime(1600, audioContext.currentTime);
            oscillator2.frequency.exponentialRampToValueAtTime(2400, audioContext.currentTime + 0.1);
            
            // Envelope
            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator1.start(audioContext.currentTime);
            oscillator1.stop(audioContext.currentTime + 0.2);
            oscillator2.start(audioContext.currentTime);
            oscillator2.stop(audioContext.currentTime + 0.2);
        }

        // Control background music 
        function toggleMusic() {
            if (musicPlaying) {
                bgMusic.pause();
                musicPlaying = false;
            } else {
                bgMusic.volume = musicVolume;
                bgMusic.play().catch(e => console.log('Audio play failed:', e));
                musicPlaying = true;
            }
        }

        function startMusic() {
            if (!musicPlaying) {
                bgMusic.volume = musicVolume;
                bgMusic.play().catch(e => console.log('Audio play failed:', e));
                musicPlaying = true;
            }
        }        

        //
        function activateSuperWeapon() {
            if (superWeaponUses <= 0 || superWeaponActive) return;
            
            initAudio();
            playSuperWeaponSound();
            
            superWeaponUses--;
            superWeaponActive = true;
            superWeaponTimer = 45; // 0.75 seconds at 60fps
            
            // Award points and clear rockets during flash
            setTimeout(() => {
                score += rockets.length * 3;
                rockets = [];
            }, 500); // Clear during flash
        }

        function shootWeapon(x, y) {
            const currentTime = Date.now();
            
            if (weaponLevel === 3) { // Machine gun mode
                if (currentTime - lastShotTime < machineGunRate) return;
                lastShotTime = currentTime;
            }
            
            // Calculate bullet spawn positions based on spaceship rotation
            const cos = Math.cos(spaceship.rotation);
            const sin = Math.sin(spaceship.rotation);
            
            if (laserMode) {
                if (weaponLevel === 1) {
                    // Single laser from spaceship nose
                    const offsetX = sin * -15; // Offset to nose
                    const offsetY = cos * -15;
                    lasers.push(new Laser(spaceship.x + offsetX, spaceship.y + offsetY, spaceship.rotation));
                } else if (weaponLevel === 2) {
                    // Dual lasers from wing positions
                    const leftX = spaceship.x + (cos * -15 - sin * -15);
                    const leftY = spaceship.y + (sin * -15 + cos * -15);
                    const rightX = spaceship.x + (cos * 15 - sin * -15);
                    const rightY = spaceship.y + (sin * 15 + cos * -15);
                    lasers.push(new Laser(leftX, leftY, spaceship.rotation));
                    lasers.push(new Laser(rightX, rightY, spaceship.rotation));
                } else if (weaponLevel === 3) {
                    // Triple lasers
                    const centerX = spaceship.x + sin * -15;
                    const centerY = spaceship.y + cos * -15;
                    const leftX = spaceship.x + (cos * -20 - sin * -15);
                    const leftY = spaceship.y + (sin * -20 + cos * -15);
                    const rightX = spaceship.x + (cos * 20 - sin * -15);
                    const rightY = spaceship.y + (sin * 20 + cos * -15);
                    lasers.push(new Laser(leftX, leftY, spaceship.rotation));
                    lasers.push(new Laser(centerX, centerY, spaceship.rotation));
                    lasers.push(new Laser(rightX, rightY, spaceship.rotation));
                }
            } else {
                if (weaponLevel === 1) {
                    // Single bullet from spaceship nose
                    const offsetX = sin * -15; // Offset to nose
                    const offsetY = cos * -15;
                    bullets.push(new Bullet(spaceship.x + offsetX, spaceship.y + offsetY, spaceship.rotation));
                } else if (weaponLevel === 2) {
                    // Dual bullets from wing positions
                    const leftX = spaceship.x + (cos * -15 - sin * -15);
                    const leftY = spaceship.y + (sin * -15 + cos * -15);
                    const rightX = spaceship.x + (cos * 15 - sin * -15);
                    const rightY = spaceship.y + (sin * 15 + cos * -15);
                    bullets.push(new Bullet(leftX, leftY, spaceship.rotation));
                    bullets.push(new Bullet(rightX, rightY, spaceship.rotation));
                } else if (weaponLevel === 3) {
                    // Triple bullets
                    const centerX = spaceship.x + sin * -15;
                    const centerY = spaceship.y + cos * -15;
                    const leftX = spaceship.x + (cos * -20 - sin * -15);
                    const leftY = spaceship.y + (sin * -20 + cos * -15);
                    const rightX = spaceship.x + (cos * 20 - sin * -15);
                    const rightY = spaceship.y + (sin * 20 + cos * -15);
                    bullets.push(new Bullet(leftX, leftY, spaceship.rotation));
                    bullets.push(new Bullet(centerX, centerY, spaceship.rotation));
                    bullets.push(new Bullet(rightX, rightY, spaceship.rotation));
                }
            }
            
            playShootSound();
        }
        
        // wingmen - Visual Effect
        function showFormationChange() {
            const messages = [
                'V-FORMATION: Standard Fire',
                'LINE FORMATION: Rapid Fire!',
                'FRONT GUARD: Spread Shot!',
                'ORBITAL: 360° Defense!' // NEW
            ];
            
            setTimeout(() => {
                for (let frame = 0; frame < 90; frame++) {
                    setTimeout(() => {
                        ctx.font = 'bold 28px Arial';
                        const colors = ['#ffaa00', '#00aaff', '#ff00ff', '#00ff00']; // Added green for orbital
                        ctx.fillStyle = colors[wingmenFormation];
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.textAlign = 'center';
                        ctx.strokeText(messages[wingmenFormation], canvas.width/2, canvas.height/2 + 50);
                        ctx.fillText(messages[wingmenFormation], canvas.width/2, canvas.height/2 + 50);
                    }, frame * 16);
                }
            }, 0);
        }

        const rocketImage = new Image();

                    <stop offset="50%" style="stop-color:#ff6b00"/>

                </linearGradient>
            </defs>
            <rect x="8" y="16" width="16" height="40" fill="url(#rocketGrad)" rx="4"/>
            <polygon points="16,0 8,16 24,16" fill="#ffd93d"/>

        //Space Rock
        class SpaceRock {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -50;
                this.vy = 1 + Math.random() * 2; // Base vertical speed
                this.size = 40 + Math.random() * 20;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.health = 5;
                this.hitFlash = 0;
                
                // NEW: Random movement pattern
                this.movementPattern = Math.floor(Math.random() * 5); // 0-4 patterns
                this.movementTimer = 0;
                this.vx = 0; // Horizontal velocity
                
                // Pattern-specific parameters
                switch(this.movementPattern) {
                    case 0: // Straight down (original)
                        this.vx = 0;
                        break;
                    case 1: // Sine wave
                        this.amplitude = 100 + Math.random() * 100;
                        this.frequency = 0.02 + Math.random() * 0.03;
                        this.initialX = this.x;
                        break;
                    case 2: // Diagonal drift
                        this.vx = (Math.random() - 0.5) * 3;
                        break;
                    case 3: // Zigzag
                        this.vx = (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random());
                        this.zigzagTimer = 0;
                        this.zigzagInterval = 60 + Math.random() * 60; // Change direction every 1-2 seconds
                        break;
                    case 4: // Circular/spiral
                        this.spiralRadius = 50 + Math.random() * 50;
                        this.spiralSpeed = 0.03 + Math.random() * 0.02;
                        this.centerX = this.x;
                        break;
                }
            }
            
            update() {
                this.movementTimer++;
                
                // Apply movement pattern
                switch(this.movementPattern) {
                    case 0: // Straight down
                        this.y += this.vy;
                        break;
                        
                    case 1: // Sine wave
                        this.y += this.vy;
                        this.x = this.initialX + Math.sin(this.movementTimer * this.frequency) * this.amplitude;
                        break;
                        
                    case 2: // Diagonal drift
                        this.y += this.vy;
                        this.x += this.vx;
                        // Bounce off edges
                        if (this.x < this.size || this.x > canvas.width - this.size) {
                            this.vx *= -1;
                        }
                        break;
                        
                    case 3: // Zigzag
                        this.y += this.vy;
                        this.x += this.vx;
                        this.zigzagTimer++;
                        
                        // Change direction periodically
                        if (this.zigzagTimer >= this.zigzagInterval) {
                            this.vx *= -1;
                            this.zigzagTimer = 0;
                        }
                        
                        // Bounce off edges
                        if (this.x < this.size || this.x > canvas.width - this.size) {
                            this.vx *= -1;
                        }
                        break;
                        
                    case 4: // Spiral
                        this.y += this.vy;
                        this.centerX += (canvas.width / 2 - this.centerX) * 0.001; // Slowly drift toward center
                        this.x = this.centerX + Math.cos(this.movementTimer * this.spiralSpeed) * this.spiralRadius;
                        break;
                }
                
                this.rotation += this.rotationSpeed;
                if (this.hitFlash > 0) this.hitFlash--;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Flash white when hit
                if (this.hitFlash > 0) {
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 20;
                }
                
                // Draw irregular rock shape with pattern-specific color tint
                let rockColor = '#8b7355';
                switch(this.movementPattern) {
                    case 1: rockColor = '#9b8365'; break; // Sine - lighter
                    case 2: rockColor = '#7b6345'; break; // Diagonal - darker
                    case 3: rockColor = '#8b7365'; break; // Zigzag - reddish
                    case 4: rockColor = '#7b7375'; break; // Spiral - grayish
                }
                
                ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : rockColor;
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 * i) / 8;
                    const radius = this.size * (0.8 + Math.random() * 0.4);
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                
                // Add crater details
                ctx.fillStyle = '#6b5345';
                for (let i = 0; i < 3; i++) {
                    const cx = (Math.random() - 0.5) * this.size * 0.5;
                    const cy = (Math.random() - 0.5) * this.size * 0.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, this.size * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Health indicator (small dots)
                ctx.fillStyle = '#ff0000';
                for (let i = 0; i < this.health; i++) {
                    ctx.beginPath();
                    ctx.arc(-this.size/2 + 10 + i * 8, -this.size/2 + 5, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
                ctx.shadowBlur = 0;
            }
        }

        class Missile {
            constructor(targetX, targetY) {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 4;
                this.angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.trail = [];
                this.life = 300;
            }
            
            update() {
                // Add current position to trail
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 10) {
                    this.trail.shift();
                }
                
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                // Slight homing behavior
                if (this.life > 200) {
                    const nearestRocket = this.findNearestRocket();
                    if (nearestRocket) {
                        const newAngle = Math.atan2(nearestRocket.y - this.y, nearestRocket.x - this.x);
                        this.angle = this.angle * 0.95 + newAngle * 0.05;
                        this.vx = Math.cos(this.angle) * this.speed;
                        this.vy = Math.sin(this.angle) * this.speed;
                    }
                }
            }
            
            findNearestRocket() {
                let nearest = null;
                let minDist = Infinity;
                
                rockets.forEach(rocket => {
                    const dist = Math.hypot(rocket.x - this.x, rocket.y - this.y);
                    if (dist < minDist && dist < 200) {
                        minDist = dist;
                        nearest = rocket;
                    }
                });
                
                return nearest;
            }
            
            draw() {
                // Draw trail
                ctx.strokeStyle = 'rgba(255, 100, 0, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    if (i === 0) {
                        ctx.moveTo(point.x, point.y);
                    } else {
                        ctx.lineTo(point.x, point.y);
                    }
                }
                ctx.stroke();
                
                // Draw missile body
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(-8, -3, 16, 6);
                
                // Nose cone
                ctx.fillStyle = '#ffff44';
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(12, -2);
                ctx.lineTo(12, 2);
                ctx.closePath();
                ctx.fill();
                
                // Fixed wings (main stabilizers)
                ctx.fillStyle = '#888';
                ctx.fillRect(-6, -6, 8, 3);  // Top wing
                ctx.fillRect(-6, 3, 8, 3);   // Bottom wing
                
                // Foldable wings (side fins)
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.moveTo(-4, -4);
                ctx.lineTo(-8, -6);
                ctx.lineTo(-6, -2);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(-4, 4);
                ctx.lineTo(-8, 6);
                ctx.lineTo(-6, 2);
                ctx.closePath();
                ctx.fill();
                
                // Exhaust
                ctx.fillStyle = 'orange';
                ctx.fillRect(-12, -2, 4, 4);
                
                ctx.restore();
            }
        }

        // Wingmand Boost
        class WingmanBoost {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -30;
                this.vy = 2 + Math.random() * 2;
                this.vx = 0; // NEW: Horizontal velocity for knockback
                this.size = 30;
                this.rotation = 0;
                this.rotationSpeed = 0.08;
                this.pulse = 0;
                this.knockbackTimer = 0; // NEW: Timer for knockback effect
                this.hitCount = 0; // NEW: Track number of hits
                this.maxHits = 3; // NEW: Needs 3 hits to collect
                this.collected = false;
            }
            
            update() {
                // Apply knockback
                if (this.knockbackTimer > 0) {
                    this.y += this.vy * 0.3; // Slower descent during knockback
                    this.x += this.vx;
                    this.vx *= 0.9; // Friction
                    this.knockbackTimer--;
                    this.rotationSpeed = 0.3; // Spin faster when hit
                } else {
                    this.y += this.vy;
                    this.rotationSpeed = 0.08; // Normal rotation speed
                }
                
                // Keep within bounds
                if (this.x < this.size) {
                    this.x = this.size;
                    this.vx *= -0.5;
                }
                if (this.x > canvas.width - this.size) {
                    this.x = canvas.width - this.size;
                    this.vx *= -0.5;
                }
                
                this.rotation += this.rotationSpeed;
                this.pulse += 0.15;
            }
            
            applyKnockback(bulletX, bulletY) {
                // Calculate knockback direction (away from bullet)
                const dx = this.x - bulletX;
                const dy = this.y - bulletY;
                const distance = Math.hypot(dx, dy);
                
                if (distance > 0) {
                    this.vx = (dx / distance) * 8; // Horizontal knockback
                    this.vy = (dy / distance) * -3; // Upward knockback
                }
                
                this.knockbackTimer = 20; // 20 frames of knockback
                this.hitCount++;
            }
            
           draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Glowing effect - more intense when hit
                const glowIntensity = this.knockbackTimer > 0 ? 1 : Math.sin(this.pulse) * 0.3 + 0.7;
                ctx.shadowColor = '#00ff00';
                ctx.shadowBlur = 30 * glowIntensity;
                
                // Flash white when hit
                const fillColor = this.knockbackTimer > 0 && Math.floor(this.knockbackTimer / 3) % 2 === 0 ? '#ffffff' : '#00ff00';
                
                // Main body - star shape
                ctx.fillStyle = fillColor;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                    const outerRadius = this.size;
                    const innerRadius = this.size * 0.5;
                    
                    const outerX = Math.cos(angle) * outerRadius;
                    const outerY = Math.sin(angle) * outerRadius;
                    const innerAngle = angle + Math.PI / 5;
                    const innerX = Math.cos(innerAngle) * innerRadius;
                    const innerY = Math.sin(innerAngle) * innerRadius;
                    
                    if (i === 0) ctx.moveTo(outerX, outerY);
                    else ctx.lineTo(outerX, outerY);
                    ctx.lineTo(innerX, innerY);
                }
                ctx.closePath();
                ctx.fill();
                
                // Border
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Icon - show different text based on hit count
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                
                if (this.hitCount === 0) {
                    ctx.fillText('+W', 0, 5);
                } else {
                    ctx.fillText(`+W`, 0, -5);
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(`${this.hitCount}/${this.maxHits}`, 0, 10);
                }
                
                ctx.restore();
                ctx.shadowBlur = 0;
            }
        }
